# 自定义临时显示的持续时间（秒）
duration=14

# --- 💡 解决顶部文字重叠问题 ---
# 增加顶部避让边距（像素），把它往下推，给 uosc 的顶栏让出空间
margin_y=60

# （可选）也可以顺手把左侧边距稍微拉开一点，不要太贴边
margin_x=20