# =============================================================================
#  uosc.conf — uosc UI 框架完整配置文件
#  对应脚本：main.lua（uosc 核心）
#  版本：uosc 5.12.0
#
#  【使用说明】
#  1. 每个配置项 = 号后面填写你需要的值
#  2. 留空表示使用默认值
#  3. 多个值用逗号分隔（如 windowed,fullscreen）
#  4. 带有 # 号的行是注释，不会被读取
#  5. 本文件可直接全选替换使用
# =============================================================================


# =============================================================================
#  一、时间轴（进度条）配置
# =============================================================================

# --- 进度条样式 ---
# line   = 细线样式（干净简洁，推荐）
# bar    = 粗条样式（传统风格，较厚重）
# 默认值：line
timeline_style=line

# --- 进度条线宽（仅 line 样式有效）---
# 单位：像素。值越大线条越粗。
# 默认值：2
timeline_line_width=2

# --- 进度条完全展开时的高度（像素）---
# 鼠标悬停或触控交互时，进度条会从细线展开为粗条
# 设为 0 则禁用展开效果（始终保持细线）
# 默认值：40
timeline_size=40

# --- 进度条常驻展开状态的条件（逗号分隔）---
# 可用状态：
#   paused     = 暂停时保持展开
#   audio      = 纯音频文件时保持展开
#   image      = 图片文件时保持展开
#   video      = 视频文件时保持展开
#   idle       = 空闲（未播放文件）时保持展开
#   windowed   = 窗口模式时保持展开
#   fullscreen = 全屏模式时保持展开
# 留空则仅在鼠标悬停或触摸时展开
# 默认值：（空）
timeline_persistency=

# --- 进度条顶部边框高度（像素）---
# 在进度条上方画一条半透明边框，帮助视觉上将进度条与画面内容分离
# 默认值：1
timeline_border=1

# --- 滚轮在进度条上滚动时的跳转秒数 ---
# 在进度条区域滚动鼠标滚轮，会按此值快进/快退
# 默认使用关键帧跳转（快速），加 ! 后缀则启用精准跳转（精确到帧）
# 示例：5! 表示精准跳转 5 秒
# 默认值：5
timeline_step=5

# --- 是否在进度条上显示缓存范围指示器（流媒体场景）---
# yes  = 显示已缓存的灰色区域，方便判断可拖动范围
# no   = 不显示
# 默认值：yes
timeline_cache=yes

# --- YouTube 热力图显示模式 ---
# overlay = 在进度条上叠加热力图（推荐，直观）
# above   = 在进度条上方单独绘制热力图
# no      = 禁用热力图
# 默认值：overlay
timeline_heatmap=overlay


# =============================================================================
#  二、精简进度条配置
# =============================================================================

# --- 始终显示的压缩进度条（不展开时）---
# windowed   = 窗口模式下显示
# fullscreen = 全屏模式下显示
# always     = 始终显示
# never      = 从不显示
# 可通过 toggle-progress 命令随时切换显示状态
# 默认值：windowed
progress=never

# --- 压缩进度条的高度（像素）---
# 默认值：2
progress_size=2

# --- 压缩进度条的宽度（像素）---
# 默认值：20
progress_line_width=20


# =============================================================================
#  三、控制栏按钮配置
# =============================================================================

# --- 时间线上方的控制按钮列表（逗号分隔）---
# 设为 never 则完全禁用控制栏
#
# 【语法规则】
#   完整格式：`<{条件}>{元素}[:{参数}]#{徽章}>{阈值}?{提示文字}`
#
# 【条件控制（可选）】使用 <> 包裹
#   可用条件：
#     idle, image, audio, video           → 文件类型
#     has_many_video, has_many_audio      → 有多个轨道时显示
#     has_sub, has_many_sub               → 有字幕时显示
#     has_many_edition                    → 有多个版本时显示
#     has_chapter, has_playlist           → 有章节/播放列表时显示
#     stream                              → 流媒体时显示
#     ! 前缀表示取反（如 !audio = 非纯音频），+ 表示 AND，逗号表示 OR
#
# 【预置快捷按钮 (shorthand)】
#   play-pause      → 播放/暂停
#   menu            → 菜单
#   subtitles       → 字幕选择
#   audio           → 音轨选择
#   video           → 视频轨选择
#   playlist        → 播放列表
#   chapters        → 章节列表
#   editions        → 版本选择
#   stream-quality  → 流媒体画质切换
#   open-file       → 打开文件
#   items           → 播放列表/文件列表
#   next, prev      → 下一集/上一集
#   first, last     → 第一集/最后一集
#   audio-device    → 音频设备
#   fullscreen      → 全屏
#   loop-playlist   → 列表循环
#   loop-file       → 单文件循环
#   shuffle         → 随机播放
#   autoload        → 自动加载
#
# 【自定义按钮】
#   command:{图标}:{命令}     → 执行 mpv 命令
#   toggle:{图标}:{属性}      → 切换开关
#   cycle:{图标}:{属性}:{状态列表} → 多状态循环
#   gap[:{比例}]              → 空白间距
#   space                     → 弹性填充空白（把两侧按钮向两边推）
#   button:{名称}             → 外部脚本管理的按钮
#
# 【当前配置说明】从左到右依次为：
#   menu                    → 菜单按钮
#   gap                     → 固定间距
#   <video,audio>subtitles  → 字幕按钮（有视频或音频时显示）
#   <has_many_audio>audio   → 音轨切换（有多个音轨时显示）
#   <has_many_video>video   → 视频轨切换（有多个视频轨时显示）
#   <has_many_edition>editions → 版本切换（有多个版本时显示）
#   <stream>stream-quality  → 画质切换（流媒体时显示）
#   gap                     → 固定间距
#   space                   → 弹性空白（把后续按钮向右推）
#   command:fast_rewind:seek -5 → 快退 5 秒（自定义命令按钮）
#   play-pause              → 播放/暂停
#   command:fast_forward:seek 5  → 快进 5 秒（自定义命令按钮）
#   space                   → 弹性空白
#   shuffle                 → 随机播放
#   loop-playlist           → 列表循环
#   loop-file               → 单文件循环
#   gap                     → 固定间距
#   prev                    → 上一集
#   items                   → 播放列表
#   next                    → 下一集
#   gap                     → 固定间距
#   fullscreen              → 全屏
#
# 默认值：
#   menu,gap,<video,audio>subtitles,<has_many_audio>audio,
#   <has_many_video>video,<has_many_edition>editions,
#   <stream>stream-quality,gap,space,<video,audio>speed,space,
#   shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,command:fast_rewind:seek -5,play-pause,command:fast_forward:seek 5,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen

# --- 控制栏按钮大小（像素）---
# 数值越大按钮越大
# 默认值：32
controls_size=32

# --- 控制栏距离屏幕边缘的间距（像素）---
# 默认值：8
controls_margin=8

# --- 按钮之间的间距（像素）---
# 默认值：2
controls_spacing=2

# --- 控制栏常驻显示的条件（语法同 timeline_persistency）---
# windowed   = 窗口模式下常驻显示
# fullscreen = 全屏模式下常驻显示
# paused     = 暂停时常驻显示
# audio      = 纯音频时常驻显示
# 留空则仅在鼠标悬停时显示
# 默认值：（空）
controls_persistency=


# =============================================================================
#  四、音量控制
# =============================================================================

# --- 音量控件位置 ---
# none   = 不显示
# left   = 屏幕左侧垂直显示
# right  = 屏幕右侧垂直显示（推荐）
# 默认值：right
volume=right

# --- 音量控件大小（像素，宽度）---
# 默认值：0
volume_size=

# --- 音量控件边框厚度（像素）---
# 默认值：1
volume_border=1

# --- 每次滚动/拖动的音量步进值（百分比）---
# 默认值：1
volume_step=1

# --- 音量控件常驻显示的条件（语法同 timeline_persistency）---
# 留空则仅在鼠标悬停时显示
# 默认值：（空）
volume_persistency=


# =============================================================================
#  五、播放速度控件
# =============================================================================

# --- 速度调整步进值 ---
# 每次点击速度按钮增加/减少的值
# 默认值：0.1
speed_step=0.1

# --- 速度步进是否以倍率计算 ---
# yes = 每次调整乘以/除以 (1 + speed_step) 而非加减 speed_step
#       例：1.0 → 1.1 → 1.21（乘法模式）
# no  = 每次调整增加/减少 speed_step
#       例：1.0 → 1.1 → 1.2（加法模式）
# 默认值：no
speed_step_is_factor=no

# --- 速度控件常驻显示的条件（语法同 timeline_persistency）---
# 留空则仅在鼠标悬停时显示
# 默认值：（空）
speed_persistency=


# =============================================================================
#  六、菜单配置
# =============================================================================

# --- 菜单项高度（像素）---
# 默认值：36
menu_item_height=36

# --- 菜单最小宽度（像素）---
# 默认值：260
menu_min_width=260

# --- 菜单内边距（像素）---
# 默认值：4
menu_padding=4

# --- 是否启用键盘搜索（输入任意字符即开始搜索）---
# yes = 直接输入字符触发搜索（注意：此时无法用同一按键关闭菜单）
# no  = 需按 / 或 Ctrl+F 激活搜索
# 默认值：yes
menu_type_to_search=yes


# =============================================================================
#  七、顶栏配置
# =============================================================================

# --- 顶栏显示模式 ---
# never      = 从不显示
# no-border  = 仅在无边框模式下显示（推荐）
# always     = 始终显示
# 默认值：no-border
top_bar=no-border

# --- 顶栏高度（像素）---
# 默认值：40
top_bar_size=40

# --- 顶栏窗口控制按钮位置 ---
# no     = 隐藏
# left   = 左侧显示（最小化/最大化/关闭）
# right  = 右侧显示（推荐，符合 Windows 习惯）
# 默认值：right
top_bar_controls=right

# --- 顶栏标题显示 ---
# no     = 不显示标题
# yes    = 使用 mpv.conf 中的 title 配置
# 自定义字符串 = 支持属性扩展，如 ${media-title}
# 默认值：yes
top_bar_title=yes

# --- 备选标题模板 ---
# 若备选标题与主标题相同，则自动隐藏
# 建议：主标题用 ${media-title}，备选标题用 ${filename}
# 默认值：（空）
top_bar_alt_title=

# --- 备选标题显示方式 ---
# below   = 在主标题下方额外显示一行（双行标题）
# toggle  = 点击顶栏在主标题与备选标题之间切换（可通过 toggle-title 命令触发）
# 默认值：below
top_bar_alt_title_place=below

# --- 顶栏闪动触发条件（加载文件时短暂闪光提示）---
# 可用值：audio, video, image, chapter（逗号分隔）
# 默认值：video,audio
top_bar_flash_on=video,audio

# --- 顶栏常驻显示的条件（语法同 timeline_persistency）---
# 留空则仅在鼠标悬停时显示
# 默认值：（空）
top_bar_persistency=


# =============================================================================
#  八、窗口边框配置（无边框模式下）
# =============================================================================

# --- 无边框模式下的窗口边框厚度（像素）---
# 让无边框窗口仍有可视边界
# 设为 0 则完全无边框
# 默认值：1
window_border_size=1


# =============================================================================
#  九、自动连播配置
# =============================================================================

# --- 播放结束后是否自动加载同目录的下一文件 ---
# 启用后，uosc 会自动设置 mpv 的 keep-open=yes 和 keep-open-pause=no
# 加载的文件类型由下面的 load_types 决定
# 默认值：no
autoload=no

# --- 是否启用随机播放模式（shuffle）---
# 启用后，播放列表/目录中的文件将随机播放
# 界面上会显示一个可切换的随机播放按钮
# 默认值：no
shuffle=no


# =============================================================================
#  十、界面缩放与外观
# =============================================================================

# --- 界面整体缩放系数 ---
# 所有 UI 元素整体放大/缩小
# 默认值：1
scale=1

# --- 全屏模式下的额外缩放系数 ---
# 全屏时 UI 元素额外放大倍数
# 默认值：1.3
scale_fullscreen=1.3

# --- 字体缩放系数（调整文字大小）---
# 默认值：1
font_scale=1

# --- 直接绘制在视频上的文字和图标边框厚度 ---
# 增加此值可提高文字的易读性（尤其浅色画面）
# 默认值：1.2
text_border=1.2

# --- 按钮、菜单等矩形的圆角半径（像素）---
# 默认值：4
border_radius=4

# --- 全局使用粗体字体 ---
# yes = 所有文字加粗（更醒目）
# no  = 仅标题使用粗体
# 默认值：no
font_bold=no


# =============================================================================
#  十一、颜色自定义
# =============================================================================

# --- 界面颜色覆写（逗号分隔，RGB HEX 格式，不带 #）---
#
# 可用的颜色键：
#   foreground       → 前景色（高亮选中框颜色）
#   foreground_text  → 前景文字色（高亮框内的文字颜色）
#   background       → 背景色（菜单面板底色）
#   background_text  → 背景文字色（菜单内的普通文字）
#   curtain          → 幕布色（背景遮罩）
#   success          → 成功状态色（如更新完成）
#   error            → 错误状态色
#   match            → 匹配/高亮色（搜索时匹配的字符颜色）
#   heatmap          → YouTube 热力图颜色
#
# 格式示例：color=foreground=9933FF,background=110B1C
#
# 默认值：
#   foreground=ffffff,foreground_text=000000,background=000000,
#   background_text=ffffff,curtain=111111,success=a5e075,
#   error=ff616e,match=69c5ff,heatmap=00adee

# --- 当前已启用：暗夜赛博紫主题 ---
# 背景：深紫黑底（#110B1C）
# 文字：浅紫灰（#D0C8D8）
# 前景高亮：电竞紫（#9933FF）
# 匹配高亮：同电竞紫
color=background=110B1C,background_text=D0C8D8,foreground=9933FF,foreground_text=FFFFFF,match=9933FF

# --- 其他快捷主题（解除注释即可切换，需屏蔽上方 color= 行）---

# 方案 B: 【极客深灰】(石墨灰玻璃底 + 哔哩粉高亮 + 纯白文字)
# color=background=1A1A1A,background_text=E0E0E0,foreground=FB7299,foreground_text=FFFFFF,match=FB7299

# 方案 C: 【初音未来】(暗黑玻璃底 + 初音绿高亮 + 黑色高亮字)
# color=background=101010,background_text=E0E0E0,foreground=39C5BB,foreground_text=000000,match=39C5BB

# 方案 D: 【赛博霓虹】(纯黑底 + 赛博青高亮 + 黑色高亮字)
# color=background=000000,background_text=FFFFFF,foreground=00FFFF,foreground_text=000000,match=00FFFF


# =============================================================================
#  十二、透明度自定义
# =============================================================================

# --- 界面元素背景透明度覆写（值范围 0~1，1=完全不透明）---
#
# 可用的透明度键：
#   timeline            → 进度条背景
#   position            → 当前位置指示器
#   chapters            → 章节标记点
#   slider              → 滑块
#   slider_gauge        → 滑块进度指示
#   controls            → 控制栏背景（0=完全透明，仅显示按钮）
#   speed               → 速度控件
#   menu                → 菜单
#   submenu             → 子菜单
#   border              → 边框
#   title               → 标题
#   tooltip             → 工具提示
#   thumbnail           → 缩略图
#   curtain             → 遮罩幕布
#   idle_indicator      → 空闲状态指示器
#   audio_indicator     → 音频状态指示器
#   buffering_indicator → 缓冲指示器
#   playlist_position   → 播放列表当前位置高亮
#   heatmap             → 热力图
#
# 格式示例：opacity=menu=0.8,controls=0.3
#
# 默认值：上述各键默认值参考文档
# 当前已覆盖：menu=0.8（菜单半透明），submenu=0.8（子菜单半透明），
#            curtain=0（幕布完全透明，不显示遮罩），thumbnail=1（缩略图完全不透明）
opacity=menu=0.8,submenu=0.8,curtain=0,thumbnail=1


# =============================================================================
#  十三、性能调优
# =============================================================================

# --- 性能增强功能（会增加 CPU 开销）---
# text_width  → 更精确的文字宽度测量（逐字符计算）
# sorting     → 更好的文件名排序（特别是东亚语言，仅 Windows 有效）
# 多个值用逗号分隔
# 默认值：（空）
refine=


# =============================================================================
#  十四、动画与交互
# =============================================================================

# --- 动画持续时间（毫秒）---
# 设为 0 可禁用所有动画（提升响应速度）
# 默认值：100
animation_duration=240

# --- 闪动持续时间（毫秒，用于 flash-{元素} 命令）---
# 默认值：1000
flash_duration=1000

# --- 渐入/渐出的距离阈值（像素）---
# 当鼠标距离元素小于 proximity_in 时完全显示
# 大于 proximity_out 时完全隐藏
# 默认值：proximity_in=40, proximity_out=120
proximity_in=40
proximity_out=120


# =============================================================================
#  十五、时间显示
# =============================================================================

# --- 目标时间显示模式 ---
# total                → 总时长（如 01:23:45）
# playtime-remaining   → 按当前播放速度换算的剩余时间（推荐，看片时最直观）
# time-remaining       → 文件剩余时长（不考虑速度，纯物理剩余时间）
# 默认值：playtime-remaining
destination_time=total

# --- 时间显示精度（小数位数）---
# 0 = 只显示秒（hh:mm:ss）
# 1 = 显示 1 位小数（hh:mm:ss.t）
# 2 = 显示 2 位小数（hh:mm:ss.tt）
# 默认值：0
time_precision=0


# =============================================================================
#  十六、流媒体与缓冲
# =============================================================================

# --- 缓冲时间显示阈值（秒）---
# 当缓冲时间低于此值时，在进度条上显示缓冲指示器
# 设为 0 则禁用
# 默认值：60
buffered_time_threshold=60


# =============================================================================
#  十七、自动隐藏与指示器
# =============================================================================

# --- 是否随鼠标光标自动隐藏 UI ---
# 隐藏时机由 mpv.conf 中的 cursor-autohide 控制（毫秒）
# 默认值：no
autohide=no

# --- 暂停指示器显示模式 ---
# flash   → 暂停时闪动提示（短暂出现后消失）
# static  → 常驻显示暂停图标
# manual  → 由 flash-pause-indicator 和 decide-pause-indicator 命令手动控制
# 默认值：flash
pause_indicator=flash


# =============================================================================
#  十八、流媒体画质选项（YouTube 等）
# =============================================================================

# --- 流媒体画质菜单中显示的选项列表 ---
# 按从高到低排列，只显示列表中存在的分辨率
# 默认值：4320,2160,1440,1080,720,480,360,240,144
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144


# =============================================================================
#  十九、文件类型定义
# =============================================================================

# --- 视频文件扩展名（逗号分隔）---
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m

# --- 音频文件扩展名（逗号分隔）---
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv

# --- 图片文件扩展名（逗号分隔）---
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp

# --- 字幕文件扩展名（逗号分隔）---
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt

# --- 播放列表文件扩展名（逗号分隔）---
playlist_types=m3u,m3u8,pls,url,cue

# --- autoload 自动加载的文件类型池 ---
# video   → 仅视频文件
# audio   → 仅音频文件
# image   → 仅图片文件
# playlist → 仅播放列表文件
# same    → 与当前打开的文件相同类型（不限于扩展名，由 uosc 内部判定）
# 多个值用逗号分隔
# 默认值：video,audio,image
load_types=video,audio,image


# =============================================================================
#  二十、文件浏览与目录
# =============================================================================

# --- 打开文件菜单的默认目录 ---
# Windows 下可使用 {drives} 显示盘符列表
# Unix 系统默认为 /
# 默认值：~/
default_directory=~/

# --- 是否显示隐藏文件（以点开头的文件）---
# Windows 下无法检测隐藏文件属性，此选项无效
# 默认值：no
show_hidden_files=no

# --- 删除文件时是否移入回收站（而非永久删除）---
# Linux 依赖：sudo apt install trash-cli
# macOS 依赖：brew install trash
# 默认值：no
use_trash=no


# =============================================================================
#  二十一、OSD 边距
# =============================================================================

# --- 是否根据 UI 元素的显隐自动调整 OSD 边距 ---
# 启用后，字幕等 OSD 元素会自动避开 UI 控件区域
# 默认值：yes
adjust_osd_margins=yes


# =============================================================================
#  二十二、章节范围标记（高级功能）
# =============================================================================

# --- 在进度条上标记特定章节范围的颜色 ---
# 语法：{类型}:{颜色}（逗号分隔）
# 颜色支持 RGB（rrggbb）或 RGBA（rrggbbaa）
#
# 支持的类型：
#   openings, endings → 动漫 OP/ED 章节
#   intros, outros    → 视频开场/结尾
#   ads               → SponsorBlock 标记的广告段（需配合赞助商拦截脚本）
#
# 不想标记某类型则从列表中移除即可
# 默认值：openings:30abf964,endings:30abf964,ads:c54e4e80
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80

# --- 识别简单章节范围的自定义模式（Lua 正则表达式）---
# 语法：{类型}:{模式}[,{模式N}];{类型}:{模式}[,{模式N}]
# 用于自动识别非标准命名的章节（如日文 OP/ED 标题）
# 默认值：openings:オープニング;endings:エンディング
chapter_range_patterns=openings:オープニング;endings:エンディング


# =============================================================================
#  二十三、多语言与字幕下载
# =============================================================================

# --- 界面语言优先级（从高到低）---
# slang 关键词会继承 mpv.conf 中的 --slang 配置
# 也支持自定义语言文件路径：~~/custom.json
# 多个语言用逗号分隔，按优先级从高到低排列
# 默认值：slang,en
languages=zh,en

# --- 字幕下载保存目录 ---
# 默认保存在当前视频所在目录
# 若文件来自 URL，则保存在 ~~/subtitles
# 前缀加 ! 强制所有字幕都保存到此目录
# 示例：!~~/subtitles  → 强制保存到 mpv 配置目录下的 subtitles 文件夹
# 默认值：~~/subtitles
subtitles_directory=~~/subtitles


# =============================================================================
#  二十四、禁用特定 UI 元素
# =============================================================================

# --- 需要禁用的 UI 元素 ID（逗号分隔）---
#
# 可用的 ID 及含义：
#   window_border          → 窗口边框（无边框模式下的细线边框）
#   top_bar                → 顶部标题栏（显示文件名、播放列表位置、章节等）
#   timeline               → 进度条（时间轴）—— 禁用后进度条消失
#   controls               → 底部控制栏（播放/暂停、音量、全屏等按钮）
#   volume                 → 侧边音量滑块（左侧或右侧的竖条音量控件）
#   idle_indicator         → 空闲指示器（未播放文件时屏幕中央的 mpv Logo 和提示文字）
#   audio_indicator        → 音频指示器（纯音频文件播放时屏幕中央的音频图标）
#   buffering_indicator    → 缓冲指示器（网络流媒体缓冲时屏幕中央的旋转动画）
#   pause_indicator        → 暂停指示器（暂停时屏幕中央的大暂停图标）
#
# 多个 ID 用逗号分隔
# 默认值：（空，即全部显示）
#
# ⚠️ 注意：禁用 timeline/controls/top_bar 会使对应控件完全消失，
#    请确保你不需要这些控件再禁用。
disable_elements=top_bar,timeline,controls,idle_indicator,audio_indicator


# =============================================================================
#  二十五、高级/内部配置（通常无需修改）
# =============================================================================

# --- 字幕下载服务 OpenSubtitles API 密钥 ---
# 默认值为 uosc 内置的公共密钥，可更换为自己的密钥
# 默认值：b0rd16N0bp7DETMpO4pYZwIqmQkZbYQr
open_subtitles_api_key=b0rd16N0bp7DETMpO4pYZwIqmQkZbYQr

# --- 渲染帧率上限（秒/帧）---
# 如果无法检测原生刷新率，则使用此值
# 默认值：1/60 ≈ 0.0167
# （一般无需修改，仅用于低性能设备降频）
render_delay=0.0167


# =============================================================================
#  uosc 内部使用的 mpv 属性参考（仅供了解，无需配置）
# =============================================================================

# 以下 mpv.conf 属性会被 uosc 读取并响应：
# osd-font, osd-playlist-entry, slang