# ============================================================
#  volume_fix.conf — 音视频独立配置
#  对应脚本：volume_fix.lua
# ============================================================

# --- 音频文件默认音量 ---
# 打开 .flac、.mp3、.cue 等音频文件时自动应用的音量百分比
# 仅在当前文件生效，不会影响其他文件或全局设置
# 取值范围：0 ~ 100（百分比）
audio_vol=90

# --- 视频文件默认音量 ---
# 打开 .mkv、.mp4 等视频文件时自动应用的音量百分比
# 仅在当前文件生效，不会影响其他文件或全局设置
# 取值范围：0 ~ 100（百分比）
video_vol=100

# --- 音频模式缩放分辨率 ---
# 音频文件（无视频轨道）播放时，封面渲染的目标高度（像素）
# 宽度由封面原始比例自动计算，force_original_aspect_ratio=decrease 保证不变形
# 设小一些可节省 GPU 资源，设大一些可让封面更清晰
# 默认值：1080（即限制在 1080×1080 以内）
# 常用可选值：720（省资源）、1080（默认平衡）、1440（更清晰）、2160（4K 屏幕）
# 若要与视频保持一致不缩放，可设为你的显示器分辨率高度（如 1440）
audio_scale_height=960