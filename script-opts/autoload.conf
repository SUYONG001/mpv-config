# ============================================================
#  autoload.conf — 自动加载同目录文件到播放列表配置
#  对应脚本：autoload.lua（mpv 官方内置脚本）
# ============================================================

# --- 是否禁用自动加载 ---
# yes=完全禁用自动加载；no=启用
disabled=no

# --- 是否加载图片文件 ---
# yes=将图片也加入播放列表；no=忽略图片
images=yes

# --- 是否加载视频文件 ---
# yes=将视频加入播放列表；no=忽略视频
videos=yes

# --- 是否加载音频文件 ---
# yes=将音频加入播放列表；no=忽略音频
audio=yes

# --- 额外的图片扩展名 ---
# 逗号分隔的列表，可追加更多想当成图片加载的扩展名
additional_image_exts=

# --- 额外的视频扩展名 ---
# 逗号分隔的列表，可追加更多想当成视频加载的扩展名
additional_video_exts=

# --- 额外的音频扩展名 ---
# 逗号分隔的列表，可追加更多想当成音频加载的扩展名
additional_audio_exts=

# --- 是否忽略隐藏文件 ---
# yes=忽略以点号（.）开头的隐藏文件；no=把它们也加入播放列表
ignore_hidden=yes

# --- 是否仅加载相同类型的文件 ---
# yes=打开视频时只加载同目录的视频文件，打开音频时只加载音频
# no=始终加载所有支持格式的文件（视频+音频+图片）
same_type=no

# --- 目录扫描模式 ---
# auto=使用 mpv 全局的 directory-mode 设置（默认懒加载）
# recursive=递归扫描所有子文件夹
# lazy=延迟加载子文件夹
# ignore=不扫描子文件夹
directory_mode=ignore

# --- 忽略的文件名匹配模式 ---
# 逗号分隔的 Lua 模式列表，匹配到的文件名将被忽略不加载
# 示例：^~=忽略以 ~ 开头的文件，%.bak$=忽略以 .bak 结尾的文件
ignore_patterns=