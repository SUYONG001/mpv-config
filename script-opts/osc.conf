# ============================================================
#  osc.conf — ModernX 界面配置
#  对应脚本：modernx.lua（fork by cyl0）
#  所有选项均可在本文件中覆盖，无需修改脚本
# ============================================================

# --- 窗口模式 OSC 显示 ---
# 窗口模式下是否显示 OSC
showwindowed=yes

# --- 全屏模式 OSC 显示 ---
# 全屏模式下是否显示 OSC
showfullscreen=yes

# --- 空闲时屏幕显示 ---
# 没有文件播放时，是否显示 mpv 标志和提示文字
idlescreen=yes

# --- 窗口模式下 OSC 缩放 ---
# 窗口模式下 OSC 的整体缩放比例，1.0 为默认大小
scalewindowed=1.0

# --- 全屏模式下 OSC 缩放 ---
# 全屏模式下 OSC 的整体缩放比例，1.0 为默认大小
scalefullscreen=1.0

# --- 强制窗口模式下 OSC 缩放 ---
# 当 mpv 被强制显示窗口（如纯音频播放）时，OSC 的缩放比例，通常会设大一些方便查看
scaleforcedwindow=2.0

# --- OSC 缩放是否跟随视频 ---
# yes：OSC 的大小会随视频缩放比例变化；no：始终使用固定大小
vidscale=yes

# --- OSC 自动隐藏时间 ---
# 鼠标停止移动后，OSC 保持显示的时长（毫秒）。设为负数可让 OSC 始终显示
hidetimeout=1500

# --- OSC 淡入淡出动画时长 ---
# OSC 出现和消失时的动画时长（毫秒），0 表示无动画
fadeduration=250

# --- 最小鼠标移动距离 ---
# 鼠标需要至少移动多少像素，才会触发 OSC 显示。设大一点可以防止误触
minmousemove=1

# --- 程序员模式 ---
# yes：使用 mpv 原生数值，并禁用 OSC。一般用户请保持 no
iamaprogrammer=no

# --- OSC 字体 ---
# OSC 使用的默认字体名称
font=mpv-osd-symbols

# --- 进度条滑块大小 ---
# 进度条上圆形滑块的大小比例，范围 0~1
seekbarhandlesize=1.0

# --- 显示缓存范围 ---
# 是否在进度条上显示已缓存（可拖动）的范围
seekrange=yes

# --- 缓存范围透明度 ---
# 缓存范围叠加层的透明度，0=完全透明，255=完全不透明
seekrangealpha=64

# --- 拖动进度条时按关键帧定位 ---
# yes：拖动进度条时自动吸附到最近的关键帧（推荐）；no：精确到每一帧
seekbarkeyframes=yes

# --- 显示快进/快退按钮 ---
# 是否在播放/暂停按钮两侧显示跳转 5 秒的按钮
showjump=yes

# --- 跳转按钮的秒数 ---
# 跳转按钮每次快进/快退的秒数，默认 5 秒
jumpamount=5

# --- 跳转按钮是否显示数字图标 ---
# yes：当跳转秒数为 5、10、30 时，按钮图标内会显示对应数字；no：始终使用默认图标
jumpiconnumber=yes

# --- 跳转按钮的定位模式 ---
# 跳转时的 seek 模式，可选 exact、relative+keyframes 等，一般保持 exact
jumpmode=exact

# --- OSC 标题显示内容 ---
# 进度条上方显示的标题内容，支持属性扩展。${media-title} 代表当前媒体标题
title=${media-title}

# --- 是否显示 OSC 标题 ---
# yes：在进度条上方显示文件名/标题；no：隐藏
showtitle=yes

# --- 暂停时是否保持 OSC 显示 ---
# yes：视频暂停时 OSC 不会自动隐藏；no：暂停后 OSC 仍然按 hidetimeout 自动隐藏
showonpause=no

# --- 时间显示模式 ---
# yes：显示总时长；no：显示剩余时间
timetotal=yes

# --- 显示毫秒 ---
# yes：时间显示精确到毫秒；no：只显示到秒
timems=no

# --- OSC 初始显示模式 ---
# auto=自动，always=始终显示，never=始终隐藏
visibility=auto

# --- 窗口控制按钮显示模式 ---
# auto=自动判断，yes=始终显示，no=始终隐藏（窗口最小化/最大化/关闭按钮）
windowcontrols=auto

# --- 圣诞帽 ---
# no：即使是在十二月，也不给 mpv 标志画圣诞帽。保持绿色和平（实际上就是关闭这个彩蛋）
greenandgrumpy=no

# --- 界面语言 ---
# eng=英文，chs=中文，pl=波兰语
language=chs

# --- 音量控制 ---
# yes：显示静音按钮和音量滑块；no：隐藏音量控件
volumecontrol=no

# --- 键盘导航 ---
# yes：启用方向键在 OSC 按钮之间导航；no：方向键控制进度/音量（推荐保持 no）
keyboardnavigation=no

# --- 章节悬停提示格式 ---
# 鼠标悬停在进度条章节标记上时显示的提示文字格式。%s 代表章节名。设为 "no" 可禁用提示
chapter_fmt=Chapter: %s

# ==============================================================================
#  进度条高亮主题色库 (ASS 专属 BGR 十六进制代码)
#  说明：挑选你喜欢的颜色代码，将其替换到最下方的 seekbarfgcolor 中。
#  注意：此处的颜色代码规则为 蓝-绿-红 (BGR)，与网页常用的 RGB 是反过来的！
# ==============================================================================
#
#  [ 经典 / 极客系 ]        [ 动漫 / 主题系 ]        [ 赛博 / 霓虹系 ]
#  极简纯白 : FFFFFF        哔哩粉     : 9972FB      赛博青     : FFFF00
#  油管正红 : 0000FF        初音绿     : BBC539      霓虹粉     : 7A10FF
#  深海湛蓝 : FF0000        初号机紫   : A95178      警告黄     : 00FFFF
#  暖阳金橙 : 00B3FF        罗兰电竞紫 : FF3399      剧毒绿     : 00FF00
#  ──────── 新增 ────────  ──────── 新增 ────────  ──────── 新增 ────────
#  沉稳石墨灰: 666666       蕾姆水蓝   : CC6600      赛博深紫   : 4B0080
#  经典马尔斯绿:006666      晓美焰紫   : 993366      极光绿     : 33FF00
#  温柔杏色   : 66CCFF      侑子殷红   : 0033CC      落日橙     : 0033FF
#  高级银灰   : C0C0C0      御坂茶棕   : 66BB99      冰魄蓝     : FF4400
#
# ==============================================================================
seekbarfgcolor=FF3399 