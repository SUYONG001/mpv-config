#### ------- Mpv-Playlistmanager 配置 ------- ####

# ============================================================
#  快捷键绑定（仅在播放列表可见时生效）
# ============================================================

# 是否启用动态快捷键覆盖（yes=列表可见时强制覆盖原有键位）
dynamic_binds=yes

# 可同时绑定多个键，用空格分隔

# --- 呼出/关闭播放列表 ---
key_showplaylist=SHIFT+ENTER  # 呼出完整播放列表
key_openmenu=MBTN_RIGHT       # 打开功能菜单（排序、随机、保存等）

# --- 按住时临时预览播放列表 ---
key_peek_at_playlist='        # 临时查看播放列表（按住预览，松开关闭）

# --- 列表内导航 ---
key_moveup=UP                 # 向上移动光标
key_movedown=DOWN             # 向下移动光标
key_movepageup=PGUP           # 向上翻页
key_movepagedown=PGDWN        # 向下翻页
key_movebegin=HOME            # 跳到列表开头
key_moveend=END               # 跳到列表末尾
key_selectfile=RIGHT LEFT     # 选择/取消选择文件
key_unselectfile=             # 取消选择（未设置）
key_playfile=ENTER            # 播放选中的文件
key_removefile=BS             # 从列表中移除当前文件
key_closeplaylist=ESC SHIFT+ENTER  # 关闭播放列表

# --- 附加功能键 ---
# 以下功能均已整合到右键菜单中，无需单独绑定快捷键
key_sortplaylist=TAB          # 循环切换排序方式（名称→日期→大小）
key_shuffleplaylist=          # 随机打乱播放列表（已整合到右键菜单）
key_reverseplaylist=          # 反转播放列表顺序（已整合到右键菜单）
key_loadfiles=                # 加载更多文件到列表（已整合到右键菜单）
key_saveplaylist=             # 保存当前播放列表（已整合到右键菜单）
key_selectplaylist=           # 选择并加载已保存的列表（已整合到右键菜单）

# ============================================================
#  文件名替换规则（用于美化播放列表中的显示名称）
# ============================================================

# JSON 格式，用于去除文件名中的多余字符
# 默认规则：将 URL 中的 %xx 转义字符还原为实际字符
filename_replace=[{"protocol":{"all":true},"rules":[{"%%(%x%x)":"hex_to_char"}]}]

# ============================================================
#  文件加载设置
# ============================================================

# 加载文件时支持的扩展名列表
loadfiles_filetypes=["jpg","jpeg","png","tif","tiff","gif","webp","svg","bmp","mp3","wav","ogm","flac","m4a","wma","ogg","opus","mkv","avi","mp4","ogv","webm","rmvb","flv","wmv","mpeg","mpg","m4v","3gp"]

loadfiles_on_start=no         # 启动时不自动加载文件夹内的文件
loadfiles_on_idle_start=no    # 空闲时不自动加载工作目录的文件
loadfiles_always_append=no    # 新加载的文件不总是追加到当前播放项之后

# ============================================================
#  排序与播放设置
# ============================================================

sortplaylist_on_file_add=no   # 添加文件后不自动排序
reverseplaylist_on_startup=no # 启动时不自动反转播放列表

# 默认排序方式，可选值：
#   name-asc   名称升序（A→Z）
#   name-desc  名称降序（Z→A）
#   date-asc   修改时间升序（旧→新）
#   date-desc  修改时间降序（新→旧）
#   size-asc   文件大小升序（小→大）
#   size-desc  文件大小降序（大→小）
default_sort=name-asc

# ============================================================
#  系统与路径设置
# ============================================================

system=auto                   # 操作系统类型，auto=自动检测

playlist_savepath=            # 播放列表保存路径（留空则用默认目录）
playlist_save_interactive=yes # 保存时弹出文件名输入框
playlist_save_filename=       # 固定的保存文件名（留空则自动生成）
save_playlist_on_file_end=no  # 播放结束后不自动保存播放列表

# ============================================================
#  界面行为设置
# ============================================================

show_title_on_file_load=no    # 加载新文件时不显示标题
show_playlist_on_file_load=no # 加载新文件时不自动弹出播放列表
close_playlist_on_playfile=no # 选择文件播放后不自动关闭列表

sync_cursor_on_load=yes       # 切换文件时，光标自动跟随当前播放项
loop_cursor=yes               # 光标在列表首尾可循环跳转
allow_write_watch_later_config=yes  # 允许写入"稍后观看"配置

reset_cursor_on_close=yes     # 关闭列表时，光标重置到当前播放项
reset_cursor_on_open=yes      # 打开列表时，光标重置到当前播放项

# ============================================================
#  标题显示设置
# ============================================================

# 优先显示标题的文件类型：all=全部、url=仅网址、none=都不（排序仍用文件名）
prefer_titles=url

# ============================================================
#  在线标题解析设置
# ============================================================

youtube_dl_executable=yt-dlp  # yt-dlp 可执行文件路径
resolve_url_titles=no         # 不解析在线视频标题
resolve_local_titles=no       # 不解析本地文件元数据标题
resolve_title_timeout=15      # 在线标题解析超时时间（秒）
concurrent_title_resolve_limit=10  # 同时解析的在线标题数量上限

# ============================================================
#  OSD 显示设置
# ============================================================

playlist_display_timeout=0    # OSD 无操作超时时间（秒），0=不自动关闭
peek_respect_display_timeout=no  # 预览时不遵守显示超时，松开立刻关闭
showamount=-1                 # 最大显示行数，-1=自动计算

# ============================================================
#  播放列表样式设置（ASS 标签）
# ============================================================

# 播放列表整体样式
#   \q2  不自动换行
#   \an7 对齐到左上角
#   更多 ASS 标签：http://docs.aegisub.org/3.2/ASS_Tags/
style_ass_tags={\q2\an7}
text_padding_x=30             # 文字距左右边缘的内边距（像素）
text_padding_y=60             # 文字距上下边缘的内边距（像素）

# ============================================================
#  其他视觉设置
# ============================================================

curtain_opacity=0.0           # 菜单打开时的背景遮罩不透明度（0.0=无遮罩，1.0=全黑）

# ============================================================
#  窗口标题设置
# ============================================================

set_title_stripped=no         # 不修改窗口标题
title_prefix=                 # 窗口标题前缀（未使用）
title_suffix= - mpv           # 窗口标题后缀（未使用）

# ============================================================
#  长文件名处理
# ============================================================

slice_longfilenames=no        # 不截断过长的文件名
slice_longfilenames_amount=70 # 若截断，保留的字符数

# ============================================================
#  播放列表显示模板
# ============================================================

# 播放列表顶部标题栏
#   %cursor  当前光标位置
#   %plen    播放列表总长度
playlist_header=[%cursor/%plen]

# 各状态下的文件显示模板
#   %pos  文件序号（自动补零对齐）
#   %name 文件名或标题

# 普通文件
normal_file=○ %name
# 光标悬停
hovered_file=● %name
# 被选中
selected_file=➔ %name
# 正在播放
playing_file=▷ %name
# 正在播放且被光标选中
playing_hovered_file=▶ %name
# 正在播放且被选中
playing_selected_file=➤ %name

# 列表被截断时，首尾显示的提示符
playlist_sliced_prefix=...
playlist_sliced_suffix=...

# ============================================================
#  操作反馈设置
# ============================================================

display_osd_feedback=yes      # 操作时在 OSD 上显示反馈文字