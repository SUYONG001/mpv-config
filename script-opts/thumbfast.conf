# ============================================================
#  thumbfast.conf — 缩略图预览生成器配置
#  对应脚本：thumbfast.lua
# ============================================================

# --- 缩略图尺寸 ---
# 生成缩略图的最大宽高（像素），缩略图会等比缩放以适应这些限制
# 默认值均为 200
max_height=200
max_width=200

# --- 网络视频缩略图 ---
# yes    对网络播放的视频（如 YouTube）也生成缩略图
# no     只在本地视频上生效
network=yes

# --- mpv 可执行文件路径 ---
# thumbfast 通过启动一个后台 mpv 进程来生成缩略图，所以必须知道 mpv.exe 的准确位置
# 便携版用户必须填写此项，安装版用户通常保持默认 mpv_path=mpv 即可
# 换设备时，一定要修改为当前设备上的实际路径
mpv_path=C:\mpv\mpv.exe

# 在文件打开时立刻生成后台子进程，消除首次鼠标悬停时的预览延迟与报错
spawn_first=no