# ============================================================
#  visualizer.conf — 音频播放频谱可视化配置
#  对应脚本：visualizer.lua
# ============================================================

# --- 工作模式 ---
# off          禁用可视化
# noalbumart   无专辑封面且无视频时启用可视化
# novideo      无视频时启用可视化
# force        始终启用可视化
mode=noalbumart

# --- 可视化类型 ---
# off           关闭
# showcqt       恒定Q变换频谱图
# avectorscope  矢量示波器
# showspectrum  柱形频谱图
# showcqtbar    恒定Q变换条形图
# showwaves     波形图
# showvolume    音量图
name=showcqtbar

# --- 渲染质量 ---
# verylow   非常低
# low       低
# medium    中等
# high      高
# veryhigh  非常高
quality=veryhigh

# --- 高度 ---
# 取值范围 4 ~ 12，默认为 6
height=9

# --- 强制窗口 ---
# true     始终运行可视化，无论 mpv 的 force-window 选项如何设置
# false    当 force-window 为 no 时，不运行可视化
forcewindow=true