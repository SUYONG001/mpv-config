# ==============================================================================
#  quack.conf — quack.lua 音量降低脚本的配置文件
#  对应脚本：quack.lua
#  作用：拖动进度条时自动降低音量，避免音频频繁跳转产生刺耳爆音
# ==============================================================================

# --- 拖动时音量降到原音量的比例 (0 ~ 1) ---
#   0.0 = 完全静音（最彻底消除刺耳声音，推荐）
#   0.1 = 降到原音量的 10%
#   0.5 = 降到原音量的一半（脚本默认值）
#   1.0 = 不降低音量（等于禁用此脚本）
#
# 【推荐】使用 0 或 0.1，拖动时几乎没有声音跟随
duckratio=0

# --- 拖动结束后，音量从降低状态恢复到原始音量所用时间（秒）---
#   0.1 = 极快恢复（几乎瞬间，可能仍有轻微声音残留）
#   0.5 = 快速恢复（推荐，感觉不到明显延迟）
#   1.0 = 平滑恢复
#   2.0 = 缓慢恢复（脚本默认值）
#
# 【推荐】使用 0.3 ~ 0.5，兼顾"快速恢复"和"平滑无爆音"
ducksecs=0.5