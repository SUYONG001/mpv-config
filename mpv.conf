# ============================================================
#  mpv.conf — 视频输出与基础渲染
# ============================================================

# --- 视频输出驱动 ---
# 使用显卡进行渲染，这是画质和性能的基础
vo=gpu

# --- 图形 API ---
# Windows 下 d3d11 功能最全、最稳定，优于 opengl 和 vulkan
gpu-api=d3d11

# --- 色深处理精度 ---
# 内部渲染管线以 10 bit 精度处理，提升色带区域的处理细腻度
dither-depth=10

# --- 输出像素格式 ---
# 直接将最终画面作为 10 bit RGB 信号推送给显示器
# rgb10_a2 是 10 位色深的典型格式，配合 8 抖 10 屏幕使用
# 不需要开启 Windows HDR，桌面保持 SDR 亮度
d3d11-output-format=rgb10_a2

# ============================================================
#  解码
# ============================================================

# 当前使用软解，稳定性最好、兼容性最广
hwdec=no
# 如需切回硬解，注释上一行并取消下一行的注释（NVIDIA NVDEC，省 CPU）
#hwdec=nvdec

# ============================================================
#  缩放算法（画质核心）
# ============================================================

# --- 亮度升频（Luma Upscaling）---
# 放大视频分辨率时处理亮度信息
# ewa_lanczossharp 基于 Jinc 内核，锐度高，边缘干净、细节突出
# 效果接近 madVR 的 NGU Sharp
scale=ewa_lanczossharp

# --- 色度升频（Chroma Upscaling）---
# 将低分辨率色彩信息拉升到与亮度相同的分辨率
# ewa_lanczossoft 保留 Jinc 的平滑感，色彩过渡干净
# 接近 madVR 的 NGU Soft 处理感，避免产生额外的彩色噪点
cscale=ewa_lanczossoft

# --- 降频（Downscaling）---
# 视频分辨率高于屏幕时（如 4K→2.5K）使用的缩放算法
# mitchell 是经典平衡型算法，保留细节同时不易产生摩尔纹
dscale=mitchell

# --- 抗振铃滤镜 ---
# 抑制缩放产生的边缘光晕（振铃效应）
# 0.7 是推荐的平衡值；若边缘光晕明显，可临时调高到 0.8~1.0
scale-antiring=0.7
cscale-antiring=0.7

# ============================================================
#  后处理：去色带（Debanding）
# ============================================================

# 对 8 bit 片源在天空、雾面、暗部渐层等区域特别有效
deband=no
deband-iterations=2           # 轮数：2 是高质量平衡点，动画几乎能完全消除色带
deband-threshold=35           # 阈值：35 是面向动画的中间值，不过度模糊
deband-range=16               # 作用范围：默认值，适合大部分内容
deband-grain=0                # 附加噪点：0=不额外添加（喜欢胶片感可调至 4~8）

# ============================================================
#  流畅度与同步（消除 24fps 抖动，对应 madVR smooth motion）
# ============================================================

# 启用插值，把 24fps / 30fps 融合成与屏幕刷新率匹配的画面
# 即 mpv 内置的 smooth motion 机制
interpolation=yes

# 插值算法：oversample 通过加权混合帧实现顺滑
# 会产生极轻微的模糊，但远比 24fps 直接显示的抖动舒服
# 原理与 madVR 默认的 smooth motion 一致
tscale=oversample

# 以显示器刷新率为基准进行音视频同步（插值和丢帧策略的基础）
# 当前未启用，若出现音画不同步可取消注释
video-sync=display-resample

# ============================================================
#  自适应锐化（Sharpening）
# ============================================================

# 当前 ewa_lanczossharp 已提供足够锐度，暂不引入额外着色器
# 如以后需要更锋利的效果，可添加 adaptive-sharpen.glsl 等
# 现阶段让内置算法 100% 主导画质

# ============================================================
#  字幕
# ============================================================

# 自动加载与视频同名的字幕文件，支持简繁体模糊匹配
sub-auto=fuzzy

# 额外搜索以下子文件夹中的字幕
sub-file-paths=Subtitles;subs;sub

# 将字幕渲染到视频源分辨率并随视频一起缩放
# 保证字幕分辨率与画面一致，同时保证屏幕字的颜色与画面一致
blend-subtitles=video

# ============================================================
#  播放行为
# ============================================================

# 视频播放到结尾时不关闭窗口
keep-open=yes

# 记住播放进度，下次打开同一文件时自动跳转到上次位置
save-position-on-quit

# 音量上限 100%，防止误触拉到 1000%
volume-max=100

# 初始音量 100%（不放大也不缩小），如觉得偏大可改为 80
volume=100

# 当前视频播完后自动跳转到同文件夹的下一个视频
# 需要 scripts/autoload.lua 配合工作
#keep-playlist=yes

# --- OSC 界面切换 ---
# 关闭 mpv 自带的默认进度条
# ModernX 脚本提供现代界面与缩略图预览，故关闭内置 OSC
osc=no

# ============================================================
#  Auto Profiles (条件自动配置)
#  注意：Profile 必须写在 mpv.conf 的最末尾！
# ============================================================

[Mid-Resolution-Deband]
# 触发条件：视频原生高度 >= 720 且 < 2160（覆盖 720P, 1080P, 1440P 等常见视频）
# 抛弃路径依赖，只要分辨率落在这个区间，自动开启高强度去色带
profile-cond=height >= 720 and height < 2160
profile-restore=copy
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=0

[High-Resolution]
# 触发条件：视频原生宽度 >= 2560（即 2K 及以上的超高清视频）
profile-cond=width >= 2560
profile-restore=copy
# 这种原盘/高码率视频通常不需要去色带，强制关闭以保留皮肤毛孔和胶片颗粒
deband=no

[Low-Quality]
# 触发条件：视频原生高度 <= 720（老旧视频或低画质视频）
profile-cond=height <= 720
profile-restore=copy
# 为低画质视频额外开启去铃效应，抑制马赛克和边缘光晕
scale-antiring=0.8
cscale-antiring=0.8


