# ============================================================
#  input.conf — 快捷键与右键菜单配置 (uosc 终极版)
# ============================================================

# --- 基础播放控制 ---
SPACE          cycle pause            #menu: 播放控制 > ⏯ 暂停 / 继续
l              ab-loop                #menu: 播放控制 > 🔁 设定 / 取消 A-B 循环段
q              quit                   #menu: 播放控制 > ❌ 退出 mpv
f              cycle fullscreen       #menu: 播放控制 > 🔲 切换全屏
m              cycle mute             #menu: 播放控制 > 🔇 切换静音
#menu: -

# --- 📜 导航与列表 ---
p              script-binding uosc/playlist           #menu: 导航 > 📜 播放列表
o              script-binding uosc/open-file          #menu: 导航 > 📂 打开文件...
#menu: -

# --- 🎛️ 轨道选择 (uosc 高级面板) ---
j              script-binding uosc/subtitles          #menu: 轨道选择 > 📝 字幕列表
a              script-binding uosc/audio              #menu: 轨道选择 > 🎵 音轨列表
v              script-binding uosc/video              #menu: 轨道选择 > 🎞️ 视频轨列表
#menu: -

# --- ⏩ 播放速率控制 ---
[              add speed -0.1         #menu: 播放速度 > ⏪ 减速 (-0.1x)
]              add speed  0.1         #menu: 播放速度 > ⏩ 加速 (+0.1x)
BS             set speed  1.0         #menu: 播放速度 > ⏺️ 恢复正常 (1.0x)
#menu: 播放速度 > -
{              set speed  1.25        #menu: 播放速度 > 🏃 1.25 倍速
}              set speed  1.5         #menu: 播放速度 > 🏃 1.5 倍速
\              set speed  2.0         #menu: 播放速度 > 🚀 2.0 倍速
#menu: -

# --- 🎯 进阶画质与滤镜控制 ---
b              cycle deband           #menu: 画质与滤镜 > ✨ 智能去色带
d              cycle deinterlace      #menu: 画质与滤镜 > 📺 消除横纹 (去交错)
#menu: -

# --- 📸 截图神器 ---
s              screenshot             #menu: 截图工具 > 📸 截取当前画面 (含字幕)
S              screenshot video       #menu: 截图工具 > 🖼️ 截取原生原画 (无界面)
#menu: -

# --- 📺 画面强制控制 ---
A              cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" #menu: 画面控制 > 📐 切换画面比例
R              add video-rotate 90    #menu: 画面控制 > 🔄 顺时针旋转 90°
#menu: -

# --- 📊 查看播放信息 / 性能统计 ---
i              script-binding stats/display-stats-toggle  #menu: 📊 性能统计 > 👁️‍🗨️ 显示 / 隐藏总开关
#              script-binding stats/display-page-1        #menu: 📊 性能统计 > 📄 1. 基础概览 (默认)
#              script-binding stats/display-page-2        #menu: 📊 性能统计 > ⏱️ 2. 帧计时与渲染耗时
#              script-binding stats/display-page-3        #menu: 📊 性能统计 > 💽 3. 缓存与运行状态
#              script-binding stats/display-page-4        #menu: 📊 性能统计 > ⚙️ 4. 激活的预设 (Profiles)

# ============================================================
# 👇 隐藏快捷键 (不显示在菜单中，保持界面极简)
# ============================================================
ENTER          cycle fullscreen       
ESC            set fullscreen no      
UP             add volume 2           
WHEEL_UP       add volume 2           
DOWN           add volume -2          
WHEEL_DOWN     add volume -2          
RIGHT          seek 5                 
LEFT           seek -5                
Ctrl+RIGHT     seek 60                
Ctrl+LEFT      seek -60               
MBTN_LEFT      cycle pause            

# ============================================================
# 👇 召唤 uosc 终极半透明菜单 👇
# ============================================================
MBTN_RIGHT     script-binding uosc/menu

# --- ⌨️ 键盘终极召唤阵 ---
TAB            script-binding uosc/menu               # 键盘 Tab 键：在屏幕正中央瞬间唤醒/隐藏菜单